name: Validate homepage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: true

      - name: Validate publication metadata
        run: ruby bin/validate_publication_topics.rb

      - name: Build Jekyll site
        run: bundle exec jekyll build
